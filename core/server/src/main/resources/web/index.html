<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Droid Containers · Console</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1c1e21;--mut:#65676b;--acc:#2563eb;--acc-weak:#e8f0fe;--ok:#16a34a;--ok-bg:#dcfce7;--warn:#dc2626;--warn-bg:#fee2e2;--bd:#e4e6eb;--bd2:#f0f1f3;--hover:#eef1f5;--code:#f6f7f9;--radius:12px;--mono:ui-monospace,Menlo,Consolas,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--fg:#e6edf3;--mut:#8b949e;--acc:#4493f8;--acc-weak:#1c2f4a;--ok:#3fb950;--ok-bg:#14301f;--warn:#f85149;--warn-bg:#3d1418;--bd:#30363d;--bd2:#21262d;--hover:#1d232b;--code:#0d1117}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC",Roboto,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);font-size:14px}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.shell{display:flex;min-height:100vh}
aside{width:216px;flex:0 0 216px;background:var(--card);border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh}
.brand{font-size:15px;font-weight:600;padding:2px 8px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{border:none;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--mut);font-size:14px;text-align:left}
nav button:hover{background:var(--hover);color:var(--fg)}
nav button.on{background:var(--acc);color:#fff}
.side{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--mut)}
.side label{display:flex;flex-direction:column;gap:4px}
.side select{border:1px solid var(--bd);border-radius:8px;padding:6px;background:var(--card);color:var(--fg);font-size:12px}
main{flex:1;max-width:1160px;margin:0 auto;padding:16px;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .spacer{flex:1}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd2);word-break:break-all;vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:12px;white-space:nowrap}
tbody tr:hover{background:var(--hover)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:var(--acc-weak);color:var(--acc);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.err{background:var(--warn-bg);color:var(--warn)}
.tag.mut{background:var(--bd2);color:var(--mut)}
.tag.gold{background:#fdf1d7;color:#9a6700}
@media(prefers-color-scheme:dark){.tag.gold{background:#3d2e0a;color:#e3b341}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.act{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--fg)}
button.act:hover{background:var(--hover)}
button.act:disabled{opacity:.45;cursor:not-allowed}
button.act.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.act.dgr{color:var(--warn);border-color:var(--warn)}
input,textarea,select{border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:14px;width:100%;font-family:inherit;background:var(--card);color:var(--fg)}
textarea{min-height:180px;font-family:var(--mono);font-size:13px}
.mut{color:var(--mut);font-size:12px}
.stat{display:flex;gap:12px;flex-wrap:wrap}
.stat>div{flex:1;min-width:120px;background:var(--bg);border-radius:10px;padding:12px}
.stat b{font-size:22px;display:block}
.bar{height:6px;background:var(--bd2);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
#logs{background:var(--code);color:var(--fg);font-family:var(--mono);font-size:12px;padding:10px;border-radius:8px;max-height:340px;overflow:auto;white-space:pre-wrap}
.overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.overlay[hidden]{display:none}
.overlay .card{width:min(420px,94vw)}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:30}
.toast{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--acc);border-radius:8px;padding:10px 14px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.12);max-width:340px}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--warn)}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tpl{background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.tpl:hover{border-color:var(--acc)}
.tpl .name{font-weight:600;font-size:14px}
.tpl .desc{color:var(--mut);font-size:12px;min-height:32px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.drw{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;justify-content:flex-end;z-index:20}
.drw>div{width:min(520px,100%);background:var(--bg);height:100%;overflow:auto;padding:18px;box-sizing:border-box}
.drw h3{margin:12px 0 8px;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:8px 0}
.kv b{color:var(--mut);font-weight:500;white-space:nowrap}
.termov{position:fixed;inset:0;background:#0d1117;z-index:26;display:flex;flex-direction:column}
.termhead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#161b22;color:#e6edf3;font-size:14px}
.termhead b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.termhost{flex:1;padding:0 8px 8px;min-height:0}
.termhost #termbox{height:100%}
@media(max-width:899px){.shell{flex-direction:column}aside{width:auto;flex:0 0 auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1px solid var(--bd)}nav{flex-direction:row;overflow-x:auto}.side{margin:0;flex-direction:row;align-items:center}}
</style>
</head>
<body>
<script id="gate" type="application/json">__GATE_JSON__</script>

<div id="gatepage" class="overlay" hidden>
  <div class="card">
    <h2 data-i18n="gate.title"></h2>
    <p class="mut" style="margin:8px 0" data-i18n="gate.hint"></p>
    <p class="mut" style="margin:0 0 10px" data-i18n="gate.phone"></p>
    <button class="act pri" style="width:100%" data-act="gate.recheck" data-i18n="gate.recheck"></button>
  </div>
</div>

<div id="login" class="overlay" hidden>
  <div class="card">
    <h2 data-i18n="login.title"></h2>
    <p class="mut" style="margin:8px 0" data-i18n="login.hint"></p>
    <input id="tk" data-i18n-ph="login.placeholder">
    <button class="act pri" style="margin-top:10px;width:100%" data-act="login.submit" data-i18n="login.submit"></button>
    <p id="lerr" class="mut" style="color:var(--warn);margin-top:8px"></p>
  </div>
</div>

<div class="shell" id="shell" hidden>
  <aside>
    <div class="brand">📦 <span data-i18n="app.name"></span></div>
    <nav id="nav"></nav>
    <div class="side">
      <label><span data-i18n="common.language"></span><select id="langsel"></select></label>
      <label><span data-i18n="common.baseAddress"></span><select id="baseaddr"></select></label>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="toasts"></div>
<div id="modalroot"></div>

const LANG_KEY = "andc_lang";
let LANG = (function pick() {
  const saved = localStorage.getItem(LANG_KEY);
  if (saved && saved !== "auto" && I18N[saved]) return saved;
  return detectBrowserLang();
})();
function detectBrowserLang() {
  const tags = navigator.languages || [navigator.language || "en"];
  for (const raw of tags) {
    const tag = String(raw).toLowerCase();
    const hit = Object.keys(I18N).find(k => tag === k || tag.startsWith(k + "-"));
    if (hit) return hit;
  }
  return "en";
}
function T(key, vars) {
  let s = (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(String(vars[k]));
  return s;
}
function tr(prefix, value) { const k = prefix + value; return T(k) === k ? value : T(k); }
function applyI18n() {
  document.documentElement.lang = LANG;
  document.title = T("app.name") + " · " + T("app.console");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = T(el.dataset.i18nPh); });
}
function setLang(v) {
  if (v === "auto") localStorage.removeItem(LANG_KEY); else localStorage.setItem(LANG_KEY, v);
  LANG = v !== "auto" && I18N[v] ? v : detectBrowserLang();
  applyI18n(); buildNav(); buildLangSel(); go(cur, curArg);
}
function buildLangSel() {
  const sel = document.getElementById("langsel");
  sel.innerHTML = "";
  [["auto", T("common.followBrowser")], ["en", "English"], ["zh", "中文"], ["ru", "Русский"], ["ja", "日本語"]]
    .forEach(([v, label]) => { const o = document.createElement("option"); o.value = v; o.textContent = label; sel.appendChild(o); });
  sel.value = localStorage.getItem(LANG_KEY) || "auto";
}

/* ============================================================ 基础工具 ===== */
const GATE = JSON.parse(document.getElementById("gate").textContent || "{}");
let TK = localStorage.getItem("andc_tk") || "";
let cur = "dash", curArg = null, poller = null, sseCtl = null;

function esc(s) { return (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmtSize(b) { if (!b) return "0 B"; const u = ["B", "KB", "MB", "GB"]; let i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++; } return b.toFixed(1) + " " + u[i]; }
function relTime(ms) {
  const diff = Date.now() - ms, abs = Math.abs(diff);
  const rtf = new Intl.RelativeTimeFormat(LANG, { numeric: "auto" });
  if (abs < 60000) return rtf.format(Math.round(-diff / 1000), "second");
  if (abs < 3600000) return rtf.format(Math.round(-diff / 60000), "minute");
  if (abs < 86400000) return rtf.format(Math.round(-diff / 3600000), "hour");
  return new Date(ms).toLocaleString(LANG);
}
function apiUrl(p, extra) {
  const u = new URL("/api/v1" + p, location.origin);
  Object.entries(extra || {}).forEach(([k, v]) => u.searchParams.set(k, v));
  u.searchParams.set("lang", LANG);
  return u.pathname + u.search;
}
function api(p, opt) {
  const o = opt || {};
  // 合并而不是覆盖：调用方传的 headers（如 Content-Type）不得抹掉 Authorization
  const init = Object.assign({}, o, { headers: Object.assign({ Authorization: "Bearer " + TK }, o.headers) });
  return fetch(apiUrl(p), init).then(async r => {
    if (r.status === 401) { showLogin(); throw new Error(T("login.error")); }
    if (r.status === 402) { showGate(); throw new Error(T("errors.locked")); }
    if (!r.ok) {
      let msg = "HTTP " + r.status;
      try { const j = await r.json(); if (j && j.message) msg = j.message; } catch (e) { /* 形式不限 */ }
      throw new Error(msg);
    }
    return r.json();
  }).catch(e => {
    const m = e && e.message;
    if (m && m !== "unauthorized" && m !== T("errors.locked")) toast(T("errors.opFailed", { msg: m }), "err");
    throw e;
  });
}
function post(p, body) { return api(p, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }); }
function del(p, extra) { return fetch(apiUrl(p, extra), { method: "DELETE", headers: { Authorization: "Bearer " + TK } }).then(async r => { if (!r.ok) { let msg = "HTTP " + r.status; try { const j = await r.json(); if (j.message) msg = j.message; } catch (e) {} throw new Error(msg); } return r.json(); }); }
function copyText(text) {
  const done = () => toast(T("common.copied"), "ok");
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(done).catch(() => legacyCopy(text, done));
  legacyCopy(text, done);
}
function legacyCopy(text, done) {
  const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { /* 忽略 */ } ta.remove();
}
function toast(msg, kind) {
  const el = document.createElement("div"); el.className = "toast " + (kind || ""); el.textContent = msg;
  document.getElementById("toasts").appendChild(el); setTimeout(() => el.remove(), 3600);
}
function confirmDialog(text) {
  return modal(T("common.confirm"), '<p class="mut">' + esc(text) + '</p>',
    [{ label: T("common.cancel"), value: false }, { label: T("common.confirm"), value: true, danger: true }]);
}
function modal(title, bodyHtml, buttons) {
  return new Promise(resolve => {
    const wrap = document.createElement("div"); wrap.className = "overlay";
    wrap.innerHTML = '<div class="card"><h2>' + esc(title) + '</h2><div style="margin:10px 0">' + bodyHtml + '</div><div class="row" style="justify-content:flex-end"></div></div>';
    const bar = wrap.querySelector(".row");
    (buttons || [{ label: T("common.cancel"), value: false }, { label: T("common.confirm"), value: true, primary: true }]).forEach(b => {
      const btn = document.createElement("button"); btn.className = "act" + (b.primary ? " pri" : "") + (b.danger ? " dgr" : "");
      btn.textContent = b.label; btn.onclick = () => { wrap.remove(); resolve(b.value); }; bar.appendChild(btn);
    });
    wrap.addEventListener("click", e => { if (e.target === wrap) { wrap.remove(); resolve(false); } });
    document.getElementById("modalroot").appendChild(wrap);
  });
}

function showLogin() {
  document.getElementById("gatepage").hidden = true;

function boot() {
  if (GATE && GATE.unlocked === false) { showGate(); return; }
  document.getElementById("gatepage").hidden = true;
  document.getElementById("login").hidden = true;
  document.getElementById("shell").hidden = false;
  applyI18n(); buildNav(); buildLangSel();
  document.getElementById("langsel").onchange = e => setLang(e.target.value);

  api("/settings").then(s => {
    const sel = document.getElementById("baseaddr"); const cur0 = localStorage.getItem("andc_base");
    sel.innerHTML = '<option value="127.0.0.1">' + T("common.loopback") + "</option>" +
      (s.lanAddresses || []).map(ip => '<option value="' + esc(ip) + '">http://' + esc(ip) + "</option>").join("");
    sel.value = cur0 && (s.lanAddresses || []).includes(cur0) ? cur0 : ((s.lanAddresses || [])[0] || "127.0.0.1");
    localStorage.setItem("andc_base", sel.value);
  }).catch(() => {});
  go(cur);
}
async function doLogin() {
  TK = document.getElementById("tk").value.trim();
  const err = document.getElementById("lerr");
  try { await api("/settings"); localStorage.setItem("andc_tk", TK); err.textContent = ""; boot(); }

}

function startProgressSse() {
  sseCtl = new AbortController();
  fetch("/api/v1/stream/progress", { headers: { Authorization: "Bearer " + TK }, signal: sseCtl.signal }).then(r => {
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    function read() { rd.read().then(({ done, value }) => {
      if (done) return; buf += dec.decode(value, { stream: true });
      let idx; while ((idx = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const m = frame.match(/data: (.*)/);
        if (m && frame.includes("event: progress")) renderProgress(JSON.parse(m[1]));
      }
      read();
    }); }
    read();
  }).catch(() => {});
}
function renderProgress(states) {
  const el = document.getElementById("prog"); if (!el) return;
  el.innerHTML = Object.entries(states).map(([ref, p]) => {
    const pct = p.totalBytes ? Math.round(p.downloadedBytes / p.totalBytes * 100) : (p.done ? 100 : 0);
    return '<div style="margin-top:10px"><div class="row"><b style="font-size:13px">' + esc(ref) + '</b>' +
      '<span class="tag ' + (p.done ? (p.stage === "FAILED" ? "err" : "ok") : "") + '">' + esc(tr("stage.", p.stage)) + '</span>' +
      '<span class="mut">' + fmtSize(p.downloadedBytes) + " / " + fmtSize(p.totalBytes) + '</span></div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
  }).join("");
  if (Object.values(states).some(p => p.done)) loadImages();
}

  const t = tplCache.templates.find(x => x.id === id); if (!t) return;
  if (t.locked || !t.compose) { toast(T("templates.lockedHint"), "err"); return; }
  const el = document.getElementById("drw"); if (el) el.remove();
  go("compose", { fromTemplate: t.id, name: t.id, yaml: t.compose, webPorts: t.webPorts });
}
function copyTemplateYaml(id) {
  const t = tplCache.templates.find(x => x.id === id); if (!t) return;
  if (t.locked || !t.compose) { toast(T("templates.lockedHint"), "err"); return; }
  copyText(t.compose);
}
async function refreshEntitlement() {
  try {
    const r = await post("/entitlement/refresh");
    toast(r.stale ? T("templates.refreshFailed") : T("templates.refreshed"), r.stale ? "err" : "ok");
    const data = await api("/templates"); tplCache = data;
    const bar = document.getElementById("packbar");
    if (bar) bar.innerHTML = '<span class="tag ' + (r.unlocked ? "ok" : "mut") + '">' + T("templates.pack") + ": " +
      esc(r.unlocked ? T("templates.packUnlocked") : T("templates.packLocked")) + "</span>";
    renderTemplates();
  } catch (e) {}
}

/* ============================================================ 审计 ===== */
let auditRows = [];
async function pageAudit() {
  h('<div class="card"><h2>' + T("audit.title") + '<span class="spacer"></span><button class="act" data-act="audit.export">' + T("audit.export") + "</button></h2>" +
    '<div class="row" style="margin-bottom:8px"><input id="aq" data-i18n-ph="common.search" style="flex:1;min-width:160px" oninput="renderAudit()"></div>' +
    '<div id="alist"><p class="mut">' + T("common.loading") + "</p></div></div>");
  applyI18n(); auditRows = await api("/audit"); renderAudit();
}
function renderAudit() {
  const el = document.getElementById("alist"); if (!el) return;
  const q = (document.getElementById("aq") || {}).value || "";
  const rows = auditRows.filter(e => !q || (e.action + " " + e.detail + " " + e.source).toLowerCase().includes(q.toLowerCase()));
  el.innerHTML = rows.length ? "<table><tr><th>" + T("audit.time") + "</th><th>" + T("audit.source") + "</th><th>" +
    T("audit.action") + "</th><th>" + T("audit.detail") + "</th></tr>" + rows.map(e =>
    "<tr><td title=\"" + esc(new Date(e.time).toLocaleString(LANG)) + '">' + esc(relTime(e.time)) + "</td><td>" + esc(e.source) + "</td>" +
    '<td><span class="tag ' + (e.success ? "ok" : "err") + '">' + esc(tr("audit.actions.", e.action)) + "</span></td><td>" + esc(e.detail) + "</td></tr>").join("") + "</table>" :
    '<p class="mut">' + T("common.none") + "</p>";
}
function exportAudit() {
  const csv = "time,source,action,detail,success\n" + auditRows.map(e =>
    [new Date(e.time).toISOString(), e.source, e.action, '"' + String(e.detail).replace(/"/g, '""') + '"', e.success].join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "audit.csv"; a.click();
  URL.revokeObjectURL(a.href);
}

/* ============================================================ 容器终端（xterm.js + WebSocket） ===== */
let termLibPromise = null, activeTerm = null;
function loadTermLib() {
  if (!termLibPromise) {
    termLibPromise = new Promise((resolve, reject) => {
      const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "/term/xterm.min.css";
      document.head.appendChild(css);
      const s1 = document.createElement("script"); s1.src = "/term/xterm.min.js";
      s1.onload = () => {
        const s2 = document.createElement("script"); s2.src = "/term/addon-fit.min.js";
        s2.onload = resolve; s2.onerror = () => reject(new Error("fit addon")); document.head.appendChild(s2);
      };
      s1.onerror = () => reject(new Error("xterm"));
      document.head.appendChild(s1);
    });
  }
  return termLibPromise;
}
async function openTerminalModal(id, name) {
  try { await loadTermLib(); } catch (e) { toast(T("errors.opFailed", { msg: e.message }), "err"); return; }
  if (activeTerm) closeTerminalModal();
  const ov = document.createElement("div"); ov.className = "termov"; ov.id = "termov";
  ov.innerHTML = '<div class="termhead"><b id="termtitle"></b><span class="tag mut" id="termstat"></span>' +
    '<button class="act" data-act="c.term.close">' + T("common.close") + "</button></div>" +
    '<div class="termhost"><div id="termbox"></div></div>';
  document.body.appendChild(ov);
  ov.querySelector("#termtitle").textContent = T("term.title", { name: name || id });
  const stat = ov.querySelector("#termstat"); stat.textContent = T("term.connecting");
  const term = new Terminal({
    cursorBlink: true, fontSize: 14, fontFamily: "var(--mono)", scrollback: 5000,
    theme: { background: "#0d1117", foreground: "#e6edf3", cursor: "#e6edf3" },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(ov.querySelector("#termbox"));
  fit.fit();
  term.focus();

  const proto = location.protocol === "https:" ? "wss" : "ws";
  // 两段式鉴权：先 POST 换一次性短时票据，WS URL 只出示票据（长期 token 不进 URL）
  let ticket = null;
  try {
    const r = await api("/terminal-ticket", { method: "POST" });
    ticket = r && r.ticket;
  } catch (e) {}
  if (!ticket) { stat.textContent = T("term.connect_fail"); return; }
  const ws = new WebSocket(proto + "://" + location.host +
    "/api/v1/containers/" + encodeURIComponent(id) + "/terminal?ticket=" + encodeURIComponent(ticket) +
    "&cols=" + term.cols + "&rows=" + term.rows);
  ws.binaryType = "arraybuffer";
  activeTerm = { ws, term, fit, ov, onResize: () => {
    try { fit.fit(); if (ws.readyState === 1) ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows })); } catch (e) {}
  } };
  window.addEventListener("resize", activeTerm.onResize);
  ws.onopen = () => { stat.textContent = ""; term.focus(); };
  ws.onmessage = e => {
    if (e.data instanceof ArrayBuffer) { term.write(new Uint8Array(e.data)); return; }
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === "exit") term.write("\r\n\x1b[33m" + T("term.exit", { code: msg.code }) + "\x1b[0m\r\n");
    } catch (err) {}
  };
  ws.onclose = () => { stat.textContent = T("term.closed"); };
  ws.onerror = () => { stat.textContent = T("term.closed"); };
  term.onData(d => { if (ws.readyState === 1) ws.send(new TextEncoder().encode(d)); });
}
function closeTerminalModal() {
  if (!activeTerm) return;
  window.removeEventListener("resize", activeTerm.onResize);
  try { activeTerm.ws.close(); } catch (e) {}
  activeTerm.term.dispose();
  const ov = document.getElementById("termov"); if (ov) ov.remove();
  activeTerm = null;
}

if (TK) boot(); else showLogin();
applyI18n(); buildLangSel();
