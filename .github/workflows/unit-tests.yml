name: unit-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Engine unit tests
        run: ./gradlew :core:engine:testDebugUnitTest --console=plain

      - name: Data unit tests (global)
        run: ./gradlew :core:data:testGlobalDebugUnitTest --console=plain

      # cn 渠道独有逻辑（更新检查 / 版本比较）只在 src/cn 里，global 变体编不到它
      - name: Data unit tests (cn)
        run: ./gradlew :core:data:testCnDebugUnitTest --console=plain

      - name: Assemble (global debug)
        run: ./gradlew assembleGlobalDebug --console=plain
